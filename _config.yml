# Site settings
first_name: Jayashree
last_name: Narayan
url: https://jayashreenarayan.github.io
baseurl: ""
icon: favicon.png # in assets/img/

# News items live in _news/ and are shown on the home page (no separate pages)
collections:
  news:
    output: false

# Publications are read from _bibliography/papers.bib
scholar:
  last_name: [Narayan]
  first_name: [Jayashree]
  style: apa
  locale: en
  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib_onepage
  bibtex_filters: [latex, smallcaps, superscript]
  replace_strings: true
  join_strings: true
  query: "@*"
  sort_by: year,month
  order: descending

plugins:
  - jekyll/scholar
  - jekyll-sitemap
  - jekyll-email-protect

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor
